name: Build Shine Myan Thit POS for Windows

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package Windows release
        shell: pwsh
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          $zipPath = "build/Shine-Myan-Thit-POS-Windows.zip"
          if (-not (Test-Path $releaseDir)) {
            throw "Windows release directory was not created: $releaseDir"
          }
          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }
          Compress-Archive -Path "$releaseDir/*" -DestinationPath $zipPath -Force
          Write-Host "Created $zipPath"

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Shine-Myan-Thit-POS-Windows
          path: build/Shine-Myan-Thit-POS-Windows.zip
          if-no-files-found: error
          retention-days: 30
